<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color"
content="#07111f">

<link rel="manifest"
href="manifest.json">

<title>BLDC Fan Remote</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

body {
  margin:0;
  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#07111f;

  color:white;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;
}


/* =========================================================
   MAIN CARD
========================================================= */

.card {

  width:100%;

  max-width:420px;

  background:#101c2d;

  border-radius:24px;

  padding:24px;

  box-shadow:
    0 20px 50px rgba(0,0,0,.45);

}


/* =========================================================
   TITLE
========================================================= */

h1 {

  text-align:center;

  margin:0;

  font-size:30px;

  font-weight:800;

}


.subtitle {

  text-align:center;

  margin-top:6px;

  color:#8fa3bb;

  font-size:14px;

}


/* =========================================================
   STATUS
========================================================= */

.status {

  margin-top:24px;

  padding:20px;

  background:#0a1422;

  border-radius:18px;

  text-align:center;

}


.label {

  font-size:12px;

  letter-spacing:2px;

  color:#8194aa;

  margin-bottom:8px;

}


#state {

  font-size:25px;

  font-weight:800;

}


/* =========================================================
   BUTTON GRID
========================================================= */

.grid {

  margin-top:20px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

}


button {

  width:100%;

  min-height:58px;

  border:none;

  border-radius:16px;

  background:#26364b;

  color:white;

  font-size:17px;

  font-weight:700;

  cursor:pointer;

  transition:
    transform .12s,
    filter .12s;

}


button:active {

  transform:scale(.96);

}


button:hover {

  filter:brightness(1.12);

}


/* =========================================================
   ON
========================================================= */

.on {

  background:#16a765;

}


/* =========================================================
   OFF
========================================================= */

.off {

  background:#dc3545;

}


/* =========================================================
   SPEED BUTTONS
========================================================= */

.speed {

  background:#26364b;

}


/* =========================================================
   FULL SPEED
========================================================= */

.full {

  grid-column:span 2;

  background:#ff9800;

  color:white;

}


/* =========================================================
   CONNECTION
========================================================= */

.connection {

  margin-top:20px;

  text-align:center;

  font-size:13px;

  color:#8fa3bb;

}


.dot {

  display:inline-block;

  width:9px;

  height:9px;

  border-radius:50%;

  background:#22c55e;

  margin-right:5px;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:360px) {

  body {
    padding:12px;
  }

  .card {
    padding:18px;
  }

  h1 {
    font-size:26px;
  }

  button {
    min-height:54px;
    font-size:15px;
  }

}

</style>

</head>


<body>


<div class="card">


<!-- ======================================================
     TITLE
======================================================= -->

<h1>
  💨 BLDC FAN
</h1>


<div class="subtitle">
  Home Network Remote
</div>


<!-- ======================================================
     STATUS
======================================================= -->

<div class="status">

  <div class="label">
    FAN STATUS
  </div>

  <div id="state">
    OFF
  </div>

</div>


<!-- ======================================================
     BUTTONS
======================================================= -->

<div class="grid">


<!-- ON -->

<button
  class="on"
  onclick="sendCommand('ON')">

  ⏻ ON

</button>


<!-- OFF -->

<button
  class="off"
  onclick="sendCommand('OFF')">

  ⏹ OFF

</button>


<!-- ======================================================
     SPEED 1
======================================================= -->

<button
  class="speed"
  onclick="sendCommand('SPEED1')">

  SPEED 1

</button>


<!-- ======================================================
     SPEED 2
======================================================= -->

<button
  class="speed"
  onclick="sendCommand('SPEED2')">

  SPEED 2

</button>


<!-- ======================================================
     SPEED 3
======================================================= -->

<button
  class="speed"
  onclick="sendCommand('SPEED3')">

  SPEED 3

</button>


<!-- ======================================================
     SPEED 4
======================================================= -->

<button
  class="speed"
  onclick="sendCommand('SPEED4')">

  SPEED 4

</button>


<!-- ======================================================
     SPEED 5
======================================================= -->

<button
  class="speed"
  onclick="sendCommand('SPEED5')">

  SPEED 5

</button>


<!-- ======================================================
     SPEED 6
======================================================= -->

<button
  class="speed"
  onclick="sendCommand('SPEED6')">

  SPEED 6

</button>


<!-- ======================================================
     FULL
======================================================= -->

<button
  class="full"
  onclick="sendCommand('FULL')">

  ⚡ FULL SPEED

</button>


</div>


<!-- ======================================================
     CONNECTION
======================================================= -->

<div class="connection">

  <span class="dot"></span>

  ESP32 Local Network Control

</div>


</div>


<script>


// =========================================================
// SEND COMMAND
// =========================================================

function sendCommand(command)
{

  fetch(
    '/command?cmd=' +
    encodeURIComponent(command)
  )

  .then(
    function(response)
    {
      return response.text();
    }
  )

  .then(
    function(state)
    {
      document.getElementById(
        'state'
      ).innerText = state;
    }
  )

  .catch(
    function(error)
    {
      console.log(
        'Command error:',
        error
      );
    }
  );

}


// =========================================================
// UPDATE STATE
// =========================================================

function updateState()
{

  fetch('/state')

  .then(
    function(response)
    {
      return response.text();
    }
  )

  .then(
    function(state)
    {

      document.getElementById(
        'state'
      ).innerText = state;

    }
  )

  .catch(
    function(error)
    {
      console.log(
        'State error:',
        error
      );
    }
  );

}


// =========================================================
// UPDATE STATE EVERY SECOND
// =========================================================

setInterval(
  updateState,
  1000
);


// =========================================================
// INITIAL STATE
// =========================================================

updateState();


</script>


</body>

</html>
