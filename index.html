<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BLDC Fan Remote</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #101827,
            #17243a
        );

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;

    background: rgba(255,255,255,0.08);

    border-radius: 24px;

    padding: 25px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.35);

    backdrop-filter: blur(10px);
}

h1 {
    text-align: center;

    margin-top: 0;
    margin-bottom: 5px;

    font-size: 30px;
}

.subtitle {
    text-align: center;

    opacity: 0.7;

    margin-bottom: 25px;
}

.connection {
    text-align: center;

    padding: 10px;

    border-radius: 10px;

    background: #7f1d1d;

    margin-bottom: 20px;

    font-weight: bold;
}

.connection.connected {
    background: #166534;
}

.status {
    text-align: center;

    font-size: 22px;

    margin-bottom: 25px;

    padding: 15px;

    border-radius: 15px;

    background: rgba(255,255,255,0.08);
}

.section-title {
    margin-top: 20px;
    margin-bottom: 10px;

    font-size: 16px;

    opacity: 0.7;
}

.buttons {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

.speed-buttons {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

button {
    border: none;

    border-radius: 15px;

    min-height: 60px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    background: #334155;

    cursor: pointer;

    transition:
        transform 0.1s,
        opacity 0.1s;
}

button:active {
    transform: scale(0.95);
}

button:disabled {
    opacity: 0.35;
}

.on {
    background: #16a34a;
}

.off {
    background: #dc2626;
}

.full {
    background: #ea580c;

    width: 100%;

    margin-top: 12px;
}

.speed {
    background: #2563eb;
}

.footer {
    text-align: center;

    margin-top: 25px;

    font-size: 12px;

    opacity: 0.5;
}

</style>

</head>


<body>


<div class="container">

    <h1>🌀 BLDC Fan</h1>

    <div class="subtitle">
        Internet Remote Control
    </div>


    <div id="connection"
         class="connection">

        Connecting...

    </div>


    <div class="status">

        <div>
            Fan Status
        </div>

        <strong id="state">
            Unknown
        </strong>

    </div>


    <!-- ON / OFF -->

    <div class="section-title">
        Power
    </div>

    <div class="buttons">

        <button
            id="onButton"
            class="on"
            onclick="sendCommand('ON')">

            ON

        </button>


        <button
            id="offButton"
            class="off"
            onclick="sendCommand('OFF')">

            OFF

        </button>

    </div>


    <!-- SPEED -->

    <div class="section-title">
        Speed
    </div>


    <div class="speed-buttons">

        <button
            onclick="sendCommand('S1')">

            1

        </button>

        <button
            onclick="sendCommand('S2')">

            2

        </button>

        <button
            onclick="sendCommand('S3')">

            3

        </button>

        <button
            onclick="sendCommand('S4')">

            4

        </button>

        <button
            onclick="sendCommand('S5')">

            5

        </button>

        <button
            onclick="sendCommand('S6')">

            6

        </button>

    </div>


    <button
        class="full"
        onclick="sendCommand('FULL')">

        FULL POWER

    </button>


    <div class="footer">

        MQTT • HiveMQ Cloud

    </div>

</div>


<!-- MQTT.js -->

<script src=
"https://unpkg.com/mqtt/dist/mqtt.min.js">
</script>


<script>


// ====================================================
// HIVEMQ
// ====================================================

const MQTT_HOST =
    "0f361fa0238547348bd1826499d0e794.s1.eu.hivemq.cloud";


const MQTT_PORT =
    8884;


// ====================================================
// MQTT CREDENTIAL
// ====================================================

// IMPORTANT:
// Use the NEW fan_web credential here.
// Do NOT use your ESP32 credential.

const MQTT_USERNAME =
    "fan_esp32";


const MQTT_PASSWORD =
    "S@miul438502r";


// ====================================================
// TOPICS
// ====================================================

const COMMAND_TOPIC =
    "bldc-fan/7Kx92LmP/command";


const STATE_TOPIC =
    "bldc-fan/7Kx92LmP/state";


// ====================================================
// UI
// ====================================================

const connectionElement =
    document.getElementById(
        "connection"
    );


const stateElement =
    document.getElementById(
        "state"
    );


// ====================================================
// CLIENT ID
// ====================================================

const clientId =
    "fan-web-" +
    Math.random()
        .toString(16)
        .substring(2);


// ====================================================
// MQTT URL
// ====================================================

const mqttURL =
    "wss://" +
    MQTT_HOST +
    ":" +
    MQTT_PORT +
    "/mqtt";


// ====================================================
// CONNECT
// ====================================================

console.log(
    "Connecting to:",
    mqttURL
);


const client =
    mqtt.connect(
        mqttURL,
        {

            username:
                MQTT_USERNAME,

            password:
                MQTT_PASSWORD,

            clientId:
                clientId,

            clean:
                true,

            connectTimeout:
                10000,

            reconnectPeriod:
                3000

        }
    );


// ====================================================
// CONNECTED
// ====================================================

client.on(
    "connect",
    function()
    {

        console.log(
            "MQTT connected"
        );


        connectionElement
            .textContent =
            "● Connected";


        connectionElement
            .classList
            .add("connected");


        client.subscribe(
            STATE_TOPIC,
            function(error)
            {

                if (error)
                {
                    console.error(
                        "Subscribe error:",
                        error
                    );

                    return;
                }


                console.log(
                    "Subscribed to state"
                );

            }
        );

    }
);


// ====================================================
// MESSAGE
// ====================================================

client.on(
    "message",
    function(
        topic,
        message
    )
    {

        const state =
            message.toString();


        console.log(
            "State:",
            state
        );


        stateElement
            .textContent =
            state;

    }
);


// ====================================================
// DISCONNECTED
// ====================================================

client.on(
    "close",
    function()
    {

        connectionElement
            .textContent =
            "● Disconnected";


        connectionElement
            .classList
            .remove(
                "connected"
            );

    }
);


// ====================================================
// ERROR
// ====================================================

client.on(
    "error",
    function(error)
    {

        console.error(
            "MQTT error:",
            error
        );


        connectionElement
            .textContent =
            "Connection error";

    }
);


// ====================================================
// SEND COMMAND
// ====================================================

function sendCommand(
    command
)
{

    if (!client.connected)
    {

        alert(
            "Remote is not connected to HiveMQ."
        );

        return;

    }


    console.log(
        "Sending:",
        command
    );


    client.publish(
        COMMAND_TOPIC,
        command,
        {
            qos: 0,
            retain: false
        },
        function(error)
        {

            if (error)
            {

                console.error(
                    "Publish error:",
                    error
                );

                return;

            }


            console.log(
                "Command sent:",
                command
            );

        }
    );

}

</script>


</body>

</html>
