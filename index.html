<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Combined online MQTT and home Wi-Fi BLDC fan remote">
<link rel="manifest" href="manifest.json">
<title>BLDC Fan Remote</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17345b,#07111f 45%,#030914);color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center}
.app{width:min(100%,460px);padding:18px 15px}
h1{text-align:center;margin:4px 0;font-size:30px}
header p{text-align:center;color:#91a0b8;margin:0 0 16px}
.card{background:#101d30ee;border:1px solid #263957;border-radius:25px;padding:18px;margin:12px 0;box-shadow:0 18px 45px #0007}
.connection{min-height:44px;border-radius:14px;background:#3b1720;color:#fecaca;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;text-align:center;padding:8px}
.connection.home{background:#392f0d;color:#fde68a}.connection.ok{background:#0d2b21;color:#bbf7d0}
.dot{width:9px;height:9px;border-radius:50%;background:#ef4444;flex:0 0 auto}
.home .dot{background:#f59e0b;box-shadow:0 0 12px #f59e0b}.ok .dot{background:#22c55e;box-shadow:0 0 12px #22c55e}
.fan{text-align:center;width:190px;height:190px;margin:5px auto 14px;border-radius:50%;display:grid;place-items:center;background:#0b1729;border:2px solid #294263;box-shadow:inset 0 0 35px #0008}
.blades{font-size:112px;display:block}.running .blades{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state{text-align:center;font-size:27px;font-weight:900}.sub{text-align:center;color:#91a0b8;font-size:13px}
.label{color:#91a0b8;font-size:12px;font-weight:900;letter-spacing:1px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{border:0;min-height:62px;border-radius:18px;color:#fff;font-size:18px;font-weight:900;box-shadow:0 7px 18px #0004;transition:.08s}
button:active{transform:scale(.95)}button:disabled{opacity:.45}
.on{background:#16a34a}.off{background:#dc2626}.speed{background:#2563eb}.speed.active{outline:3px solid #bfdbfe}.full{width:100%;margin-top:10px;background:#ea580c}
.small{text-align:right;color:#91a0b8;font-size:12px}.row{display:flex;justify-content:space-between}
.localBtn{width:100%;background:#475569;margin-top:10px}.hint{color:#91a0b8;font-size:12px;line-height:1.45;margin:10px 2px 0}
.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:#e2e8f0;color:#07111f;padding:11px 16px;border-radius:14px;font-weight:800;transition:.2s;z-index:5;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body><main class="app">
<header><h1>🌀 BLDC Fan</h1><p>Smart Home + Internet Remote</p></header>

<section class="card">
  <div id="connection" class="connection"><span class="dot"></span><span id="connectionText">Starting…</span></div>
</section>

<section class="card">
  <div id="fan" class="fan"><span class="blades">✣</span></div>
  <div id="state" class="state">Unknown</div>
  <div id="speedText" class="sub">Waiting for fan state…</div>
</section>

<section class="card">
  <div class="label">POWER</div>
  <div class="grid2">
    <button class="on" onclick="sendCommand('ON')">ON</button>
    <button class="off" onclick="sendCommand('OFF')">OFF</button>
  </div>
</section>

<section class="card">
  <div class="row"><div class="label">SPEED</div><div id="last" class="small"></div></div>
  <div class="grid3">
    <button class="speed" data-speed="1" onclick="sendCommand('S1')">1</button>
    <button class="speed" data-speed="2" onclick="sendCommand('S2')">2</button>
    <button class="speed" data-speed="3" onclick="sendCommand('S3')">3</button>
    <button class="speed" data-speed="4" onclick="sendCommand('S4')">4</button>
    <button class="speed" data-speed="5" onclick="sendCommand('S5')">5</button>
    <button class="speed" data-speed="6" onclick="sendCommand('S6')">6</button>
  </div>
  <button class="full" onclick="sendCommand('FULL')">FULL POWER</button>
  <button class="localBtn" onclick="openHomeRemote()">🏠 Open Home Remote</button>
  <div class="hint">When your ISP is down, GitHub Pages cannot directly call an ESP32 HTTP server because the page is HTTPS. The Home Remote opens the ESP32's local mDNS address without requiring its IP.</div>
</section>

<div id="toast" class="toast"></div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const HOST="0f361fa0238547348bd1826499d0e794.s1.eu.hivemq.cloud";
const PORT=8884;
const USER="REPLACE_WITH_MQTT_USERNAME";
const PASS="REPLACE_WITH_MQTT_PASSWORD";
const CMD="bldc-fan/7Kx92LmP/command";
const STATE="bldc-fan/7Kx92LmP/state";
const LOCAL="http://fan-esp32.local/";
let client=null, mode="offline";

const $=x=>document.getElementById(x);

function setConnection(kind,text){
  const el=$("connection");
  el.classList.remove("ok","home");
  if(kind==="mqtt") el.classList.add("ok");
  if(kind==="home") el.classList.add("home");
  $("connectionText").textContent=text;
}
function toast(t){
  $("toast").textContent=t;$("toast").classList.add("show");
  clearTimeout(window._toast);window._toast=setTimeout(()=>$("toast").classList.remove("show"),1400);
}
function updateState(v){
  v=v.trim();$("state").textContent=v;$("last").textContent="Live";
  document.querySelectorAll(".speed").forEach(b=>b.classList.remove("active"));
  const u=v.toUpperCase();
  if(u==="OFF"){
    $("fan").classList.remove("running");$("speedText").textContent="Fan is off";
  }else{
    $("fan").classList.add("running");
    if(u==="ON")$("speedText").textContent="Powered on";
    else if(u==="FULL")$("speedText").textContent="Full power";
    else{
      const m=u.match(/SPEED\s*(\d+)/);
      if(m){document.querySelector(`.speed[data-speed="${m[1]}"]`)?.classList.add("active");$("speedText").textContent="Speed "+m[1]}
      else $("speedText").textContent="Running";
    }
  }
}
function connectMQTT(){
  if(!window.mqtt){setConnection("offline","Home mode available");return}
  if(USER.startsWith("REPLACE_")){setConnection("offline","MQTT credentials not configured");return}
  try{
    client=mqtt.connect(`wss://${HOST}:${PORT}/mqtt`,{
      username:USER,password:PASS,
      clientId:"fan-web-"+Math.random().toString(16).slice(2),
      clean:true,connectTimeout:8000,reconnectPeriod:3000
    });
    client.on("connect",()=>{
      mode="mqtt";setConnection("mqtt","ONLINE • MQTT");
      client.subscribe(STATE,{qos:0},()=>{});
    });
    client.on("reconnect",()=>setConnection("offline","Reconnecting MQTT…"));
    client.on("close",()=>{
      if(mode==="mqtt")mode="offline";
      setConnection("offline","Internet unavailable • Home mode");
    });
    client.on("error",e=>console.log("MQTT",e));
    client.on("message",(t,m)=>{if(t===STATE)updateState(m.toString())});
  }catch(e){setConnection("offline","Home mode available")}
}
function sendCommand(c){
  if(client?.connected){
    client.publish(CMD,c,{qos:0,retain:false},e=>toast(e?"Send failed":"Sent: "+c));
    return;
  }
  toast("Open Home Remote for local control");
}
function openHomeRemote(){
  window.location.href=LOCAL;
}
if("serviceWorker"in navigator) navigator.serviceWorker.register("sw.js");
connectMQTT();
</script>
</main></body></html>
